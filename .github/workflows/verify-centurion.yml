name: Verify Centurion Proof Extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream centurion
        uses: actions/checkout@v5
        with:
          repository: ibrahimmian36/centurion
          ref: main
      - name: Checkout proof harness
        uses: actions/checkout@v5
        with:
          path: harness
      - name: Overlay proof modules
        run: |
          cp harness/proofs/OverlapStep.lean Erdos7/OverlapStep.lean
          cp harness/proofs/CapacityLogic.lean Erdos7/CapacityLogic.lean
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Kernel-check proof modules
        run: |
          lake env lean Erdos7/OverlapStep.lean
          lake env lean Erdos7/CapacityLogic.lean
      - name: Source trust gate
        run: |
          ! grep -nE '\bsorry\b|\badmit\b|\baxiom\b|native_decide' Erdos7/OverlapStep.lean Erdos7/CapacityLogic.lean
