name: Verify Centurion Proof Extension

on:
  push:
  workflow_dispatch:

concurrency:
  group: centurion-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream centurion
        uses: actions/checkout@v5
        with:
          repository: ibrahimmian36/centurion
          ref: main
      - name: Checkout proof harness
        uses: actions/checkout@v5
        with:
          path: harness
      - name: Overlay proof modules
        run: |
          for f in OverlapStep CapacityLogic OverlapSequence RawCapacity OnePrimeCapacity ForcedModulus ConditionedForcing MultiCoreCapacity FourForcedPrimeCertificate IntegerBridgeGeneric Certificate10395 NoCover10395 Bridge10395 Audit10395 Certificate12285 NoCover12285 Bridge12285 Certificate17325 NoCover17325 Bridge17325; do
            cp harness/proofs/$f.lean Erdos7/$f.lean
          done
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Kernel-build generic engine and all three stragglers
        run: lake build Erdos7.FourForcedPrimeCertificate Erdos7.IntegerBridgeGeneric Erdos7.Bridge10395 Erdos7.Bridge12285 Erdos7.Bridge17325
      - name: Source trust gate
        run: |
          ! grep -nE '\bsorry\b|\badmit\b|\baxiom\b|native_decide' Erdos7/{OverlapStep,CapacityLogic,OverlapSequence,RawCapacity,OnePrimeCapacity,ForcedModulus,ConditionedForcing,MultiCoreCapacity,FourForcedPrimeCertificate,IntegerBridgeGeneric,Certificate10395,NoCover10395,Bridge10395,Certificate12285,NoCover12285,Bridge12285,Certificate17325,NoCover17325,Bridge17325}.lean
      - name: 10395 theorem axiom audit
        run: |
          out=$(lake env lean Erdos7/Audit10395.lean 2>&1)
          echo "$out"
          test "$(echo "$out" | grep -c 'depends on')" -eq 2
          ! echo "$out" | grep -qE 'sorryAx|_native'
          viol=$(echo "$out" | grep 'depends on' | sed 's/.*axioms: \[//; s/\]//' | tr ',' '\n' | tr -d ' ' | grep -vE '^(propext|Classical\.choice|Quot\.sound)$' || true)
          test -z "$viol"
