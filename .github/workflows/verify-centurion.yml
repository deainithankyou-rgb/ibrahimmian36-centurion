name: Verify Centurion Proof Extension

on:
  push:
  workflow_dispatch:

concurrency:
  group: centurion-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream centurion
        uses: actions/checkout@v5
        with:
          repository: ibrahimmian36/centurion
          ref: main
      - name: Checkout proof harness
        uses: actions/checkout@v5
        with:
          path: harness
      - name: Overlay proof modules
        run: |
          for f in OverlapStep CapacityLogic OverlapSequence RawCapacity OnePrimeCapacity ForcedModulus ConditionedForcing MultiCoreCapacity Certificate10395 NoCover10395; do
            cp harness/proofs/$f.lean Erdos7/$f.lean
          done
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false
      - name: Kernel-build 10395 theorem
        run: lake build Erdos7.NoCover10395
      - name: Source trust gate
        run: |
          ! grep -nE '\bsorry\b|\badmit\b|\baxiom\b|native_decide' Erdos7/{OverlapStep,CapacityLogic,OverlapSequence,RawCapacity,OnePrimeCapacity,ForcedModulus,ConditionedForcing,MultiCoreCapacity,Certificate10395,NoCover10395}.lean
