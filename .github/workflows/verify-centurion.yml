name: Verify Centurion Proof Extension

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap-step:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream centurion
        uses: actions/checkout@v5
        with:
          repository: ibrahimmian36/centurion
          ref: main
      - name: Checkout proof harness
        uses: actions/checkout@v5
        with:
          path: harness
      - name: Overlay proof module
        run: cp harness/proofs/OverlapStep.lean Erdos7/OverlapStep.lean
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
      - name: Build existing Capacity dependency
        run: lake build Erdos7.Capacity
      - name: Kernel-check overlap step
        run: lake env lean Erdos7/OverlapStep.lean
      - name: Source trust gate
        run: |
          ! grep -nE '\bsorry\b|\badmit\b|\baxiom\b|native_decide' Erdos7/OverlapStep.lean
